  </defs>
  <rect width="1200" height="260" rx="16" fill="url(#bg)"/>
  <!-- subtle data-plot motif on the right -->
  <g fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="2">
    <polyline points="760,200 820,178 880,186 940,150 1000,158 1060,112 1120,96"/>
