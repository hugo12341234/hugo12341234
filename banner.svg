  <g fill="#34d399" fill-opacity="0.55">
    <circle cx="760" cy="200" r="4"/><circle cx="820" cy="178" r="4"/><circle cx="880" cy="186" r="4"/>
    <circle cx="940" cy="150" r="4"/><circle cx="1000" cy="158" r="4"/><circle cx="1060" cy="112" r="4"/>
    <circle cx="1120" cy="96" r="4"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.06">
