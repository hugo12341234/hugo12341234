  </g>
  <rect x="72" y="72" width="64" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="72" y="138" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#ffffff">Hugo Chacón</text>
  <text x="72" y="184" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#cbd5e1">Computer Engineering · Data &amp; Machine Learning</text>
  <text x="72" y="218" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#94a3b8">Faculty of Engineering, UNAM · Mexico City</text>
